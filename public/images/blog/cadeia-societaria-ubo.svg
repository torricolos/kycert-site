<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Inter Tight', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">Cadeia societária até o beneficiário final</title><desc id="d">Empresa cliente controlada pela Holding A (60%) e pela Pessoa X (40%); a Holding A pertence às Pessoas Y e Z (50% cada), que detêm 30% indireto cada.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1l8 4-8 4z" fill="#5B616B"/></marker></defs>
<rect width="1200" height="480" rx="16" fill="#FFFFFF"/><rect x=".5" y=".5" width="1199" height="479" rx="16" fill="none" stroke="#D5DAD8"/>
<text x="40" y="56" font-size="26" font-weight="700" fill="#0E1116" text-anchor="start">Da empresa cliente ao beneficiário final</text><rect x="470" y="84" width="260" height="70" rx="12" fill="#F3F5F4" stroke="#D5DAD8" stroke-width="1.5"/><text x="600" y="115" font-size="17" font-weight="700" fill="#0E1116" text-anchor="middle">Empresa cliente (PJ)</text><text x="600" y="138" font-size="13.5" font-weight="400" fill="#5B616B" text-anchor="middle">quem pediu para abrir conta</text><rect x="150" y="214" width="260" height="70" rx="12" fill="#F3F5F4" stroke="#D5DAD8" stroke-width="1.5"/><text x="280" y="245" font-size="17" font-weight="700" fill="#0E1116" text-anchor="middle">Holding A (PJ)</text><text x="280" y="268" font-size="13.5" font-weight="400" fill="#5B616B" text-anchor="middle">60% da empresa cliente</text><rect x="790" y="214" width="260" height="70" rx="12" fill="#E8F4EE" stroke="#1F8A5B" stroke-width="2"/><text x="920" y="245" font-size="17" font-weight="700" fill="#0E1116" text-anchor="middle">Pessoa X (PF)</text><text x="920" y="268" font-size="13.5" font-weight="400" fill="#5B616B" text-anchor="middle">40% direto</text><rect x="20" y="344" width="240" height="70" rx="12" fill="#E8F4EE" stroke="#1F8A5B" stroke-width="2"/><text x="140" y="375" font-size="17" font-weight="700" fill="#0E1116" text-anchor="middle">Pessoa Y (PF)</text><text x="140" y="398" font-size="13.5" font-weight="400" fill="#5B616B" text-anchor="middle">50% da Holding A</text><rect x="300" y="344" width="240" height="70" rx="12" fill="#E8F4EE" stroke="#1F8A5B" stroke-width="2"/><text x="420" y="375" font-size="17" font-weight="700" fill="#0E1116" text-anchor="middle">Pessoa Z (PF)</text><text x="420" y="398" font-size="13.5" font-weight="400" fill="#5B616B" text-anchor="middle">50% da Holding A</text><line x1="540" y1="154" x2="330" y2="212" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><line x1="660" y1="154" x2="920" y2="212" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="284" x2="150" y2="342" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><line x1="330" y1="284" x2="400" y2="342" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><text x="620" y="372" font-size="15.5" font-weight="600" fill="#0E1116" text-anchor="start">Participação indireta = percentuais multiplicados ao longo da cadeia</text><text x="620" y="398" font-size="15.5" font-weight="400" fill="#5B616B" text-anchor="start">Y: 60% x 50% = 30%   |   Z: 60% x 50% = 30%   |   X: 40%</text><text x="620" y="424" font-size="15.5" font-weight="600" fill="#1F8A5B" text-anchor="start">Verde: pessoas naturais acima de 25% (exemplo ilustrativo)</text>
<text x="1172" y="460" text-anchor="end" font-size="14" fill="#5B616B">kycert.com.br</text>
</svg>
