<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Inter Tight', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">Ciclo de monitoramento transacional</title><desc id="d">Transação, regras e cenários, alerta, análise com o contexto do KYC, decisão e ajuste das regras, em ciclo.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1l8 4-8 4z" fill="#5B616B"/></marker></defs>
<rect width="1200" height="500" rx="16" fill="#FFFFFF"/><rect x=".5" y=".5" width="1199" height="499" rx="16" fill="none" stroke="#D5DAD8"/>
<text x="40" y="56" font-size="26" font-weight="700" fill="#0E1116" text-anchor="start">Ciclo de monitoramento transacional (KYT)</text><rect x="475" y="74.5" width="250" height="68" rx="12" fill="#F3F5F4" stroke="#D5DAD8" stroke-width="1.5"/><text x="600" y="104.5" font-size="18" font-weight="700" fill="#0E1116" text-anchor="middle">Transação</text><text x="600" y="128.5" font-size="13.5" font-weight="400" fill="#5B616B" text-anchor="middle">Pix, TED, câmbio, cripto</text><rect x="703.1976938971997" y="155.25" width="250" height="68" rx="12" fill="#F3F5F4" stroke="#D5DAD8" stroke-width="1.5"/><text x="828.1976938971997" y="185.25" font-size="18" font-weight="700" fill="#0E1116" text-anchor="middle">Regras e cenários</text><text x="828.1976938971997" y="209.25" font-size="13.5" font-weight="400" fill="#5B616B" text-anchor="middle">limites, padrões, listas</text><rect x="703.1976938971997" y="316.75" width="250" height="68" rx="12" fill="#F3F5F4" stroke="#D5DAD8" stroke-width="1.5"/><text x="828.1976938971997" y="346.75" font-size="18" font-weight="700" fill="#0E1116" text-anchor="middle">Alerta</text><text x="828.1976938971997" y="370.75" font-size="13.5" font-weight="400" fill="#5B616B" text-anchor="middle">transação fora do padrão</text><rect x="475" y="397.5" width="250" height="68" rx="12" fill="#E8F4EE" stroke="#1F8A5B" stroke-width="1.5"/><text x="600" y="427.5" font-size="18" font-weight="700" fill="#0E1116" text-anchor="middle">Análise</text><text x="600" y="451.5" font-size="13.5" font-weight="400" fill="#5B616B" text-anchor="middle">contexto do cliente (KYC)</text><rect x="246.80230610280034" y="316.75" width="250" height="68" rx="12" fill="#F3F5F4" stroke="#D5DAD8" stroke-width="1.5"/><text x="371.80230610280034" y="346.75" font-size="18" font-weight="700" fill="#0E1116" text-anchor="middle">Decisão</text><text x="371.80230610280034" y="370.75" font-size="13.5" font-weight="400" fill="#5B616B" text-anchor="middle">arquivar ou comunicar ao COAF</text><rect x="246.80230610280046" y="155.25" width="250" height="68" rx="12" fill="#F3F5F4" stroke="#D5DAD8" stroke-width="1.5"/><text x="371.80230610280046" y="185.25" font-size="18" font-weight="700" fill="#0E1116" text-anchor="middle">Ajuste</text><text x="371.80230610280046" y="209.25" font-size="13.5" font-weight="400" fill="#5B616B" text-anchor="middle">calibrar regras com o resultado</text><line x1="735" y1="104" x2="820" y2="164" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><line x1="865" y1="224" x2="865" y2="300" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><line x1="820" y1="380" x2="735" y2="430" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><line x1="465" y1="430" x2="380" y2="380" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><line x1="335" y1="300" x2="335" y2="224" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><line x1="380" y1="164" x2="465" y2="104" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><text x="600" y="270" font-size="15" font-weight="400" fill="#5B616B" text-anchor="middle">KYC alimenta</text><text x="600" y="292" font-size="15" font-weight="400" fill="#5B616B" text-anchor="middle">o perfil esperado</text>
