<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d" font-family="Inter, 'Inter Tight', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">Matriz de abordagem baseada em risco</title><desc id="d">Fatores de risco levam a um enquadramento baixo, médio ou alto e a um nível de diligência: simplificada, padrão ou reforçada.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1l8 4-8 4z" fill="#5B616B"/></marker></defs>
<rect width="1200" height="480" rx="16" fill="#FFFFFF"/><rect x=".5" y=".5" width="1199" height="479" rx="16" fill="none" stroke="#D5DAD8"/>
<text x="40" y="56" font-size="26" font-weight="700" fill="#0E1116" text-anchor="start">Da avaliação de risco à diligência aplicada</text><text x="40" y="108" font-size="14" font-weight="700" fill="#5B616B" text-anchor="start">Fatores avaliados</text><text x="420" y="108" font-size="14" font-weight="700" fill="#5B616B" text-anchor="start">Enquadramento</text><text x="820" y="108" font-size="14" font-weight="700" fill="#5B616B" text-anchor="start">Diligência</text><rect x="40" y="124" width="340" height="270" rx="12" fill="#F3F5F4" stroke="#D5DAD8" stroke-width="1.5"/><rect x="420" y="124" width="360" height="270" rx="12" fill="#F3F5F4" stroke="#D5DAD8" stroke-width="1.5"/><rect x="820" y="124" width="340" height="270" rx="12" fill="#F3F5F4" stroke="#D5DAD8" stroke-width="1.5"/><circle cx="66" cy="166" r="6" fill="#1F8A5B"/><text x="84" y="172" font-size="18" font-weight="400" fill="#0E1116" text-anchor="start">Perfil do cliente</text><circle cx="66" cy="222" r="6" fill="#1F8A5B"/><text x="84" y="228" font-size="18" font-weight="400" fill="#0E1116" text-anchor="start">Produto ou serviço</text><circle cx="66" cy="278" r="6" fill="#1F8A5B"/><text x="84" y="284" font-size="18" font-weight="400" fill="#0E1116" text-anchor="start">Canal de contratação</text><circle cx="66" cy="334" r="6" fill="#1F8A5B"/><text x="84" y="340" font-size="18" font-weight="400" fill="#0E1116" text-anchor="start">Geografia e atividade</text><rect x="446" y="148" width="308" height="56" rx="10" fill="#DDF0E6"/><text x="470" y="184" font-size="20" font-weight="700" fill="#1F8A5B" text-anchor="start">Baixo</text><rect x="446" y="226" width="308" height="56" rx="10" fill="#FFF1D6"/><text x="470" y="262" font-size="20" font-weight="700" fill="#9A6A00" text-anchor="start">Médio</text><rect x="446" y="304" width="308" height="56" rx="10" fill="#FBE0DC"/><text x="470" y="340" font-size="20" font-weight="700" fill="#B3261E" text-anchor="start">Alto</text><text x="844" y="176" font-size="17.5" font-weight="700" fill="#0E1116" text-anchor="start">Diligência simplificada</text><text x="844" y="200" font-size="14.5" font-weight="400" fill="#5B616B" text-anchor="start">dentro do que a norma admite</text><text x="844" y="254" font-size="17.5" font-weight="700" fill="#0E1116" text-anchor="start">Diligência padrão (CDD)</text><text x="844" y="278" font-size="14.5" font-weight="400" fill="#5B616B" text-anchor="start">verificações regulares</text><text x="844" y="332" font-size="17.5" font-weight="700" fill="#0E1116" text-anchor="start">Diligência reforçada (EDD)</text><text x="844" y="356" font-size="14.5" font-weight="400" fill="#5B616B" text-anchor="start">aprovação e monitoramento maiores</text><line x1="384" y1="260" x2="416" y2="260" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><line x1="784" y1="260" x2="816" y2="260" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><text x="40" y="436" font-size="15.5" font-weight="400" fill="#5B616B" text-anchor="start">Exemplo ilustrativo. Os critérios e pesos são os da avaliação interna de risco de cada instituição.</text>
<text x="1172" y="460" text-anchor="end" font-size="14" fill="#5B616B">kycert.com.br</text>
