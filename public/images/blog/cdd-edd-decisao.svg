<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-labelledby="t d" font-family="Inter, 'Inter Tight', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
<title id="t">Árvore de decisão CDD e EDD</title><desc id="d">Clientes de risco baixo ou médio seguem a diligência padrão (CDD); risco alto, PEP ou apontamento relevante exigem diligência reforçada (EDD).</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1l8 4-8 4z" fill="#5B616B"/></marker></defs>
<rect width="1200" height="490" rx="16" fill="#FFFFFF"/><rect x=".5" y=".5" width="1199" height="489" rx="16" fill="none" stroke="#D5DAD8"/>
<text x="40" y="56" font-size="26" font-weight="700" fill="#0E1116" text-anchor="start">CDD ou EDD: o risco define a diligência</text><rect x="470" y="84" width="260" height="60" rx="12" fill="#0E1116" stroke="#0E1116" stroke-width="1.5"/><text x="600" y="120" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Novo cliente avaliado</text><line x1="560" y1="146" x2="300" y2="214" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><line x1="640" y1="146" x2="900" y2="214" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="216" width="400" height="60" rx="12" fill="#F3F5F4" stroke="#D5DAD8" stroke-width="1.5"/><text x="300" y="241" font-size="18" font-weight="700" fill="#0E1116" text-anchor="middle">Risco baixo ou médio</text><text x="300" y="263" font-size="14" font-weight="400" fill="#5B616B" text-anchor="middle">sem PEP, sem apontamento relevante</text><rect x="700" y="216" width="400" height="60" rx="12" fill="#FBEFEC" stroke="#E4B5AD" stroke-width="1.5"/><text x="900" y="241" font-size="18" font-weight="700" fill="#0E1116" text-anchor="middle">Risco alto, PEP ou apontamento</text><text x="900" y="263" font-size="14" font-weight="400" fill="#5B616B" text-anchor="middle">mídia adversa, jurisdição de risco</text><line x1="300" y1="278" x2="300" y2="322" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><line x1="900" y1="278" x2="900" y2="322" stroke="#5B616B" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="324" width="400" height="120" rx="12" fill="#E8F4EE" stroke="#1F8A5B" stroke-width="1.5"/><text x="300" y="356" font-size="19" font-weight="700" fill="#0E1116" text-anchor="middle">CDD: diligência padrão</text><text x="300" y="384" font-size="14.5" font-weight="400" fill="#5B616B" text-anchor="middle">identificação e qualificação</text><text x="300" y="406" font-size="14.5" font-weight="400" fill="#5B616B" text-anchor="middle">screening de sanções e PEP</text><text x="300" y="428" font-size="14.5" font-weight="400" fill="#5B616B" text-anchor="middle">decisão registrada</text><rect x="700" y="324" width="400" height="120" rx="12" fill="#FBEFEC" stroke="#E4B5AD" stroke-width="1.5"/><text x="900" y="356" font-size="19" font-weight="700" fill="#0E1116" text-anchor="middle">EDD: diligência reforçada</text><text x="900" y="384" font-size="14.5" font-weight="400" fill="#5B616B" text-anchor="middle">origem de recursos e patrimônio</text><text x="900" y="406" font-size="14.5" font-weight="400" fill="#5B616B" text-anchor="middle">aprovação da alta gestão (PEP)</text><text x="900" y="428" font-size="14.5" font-weight="400" fill="#5B616B" text-anchor="middle">monitoramento mais frequente</text>
<text x="1172" y="470" text-anchor="end" font-size="14" fill="#5B616B">kycert.com.br</text>
</svg>
