"middle">evidência registrada</text><text x="40" y="420" font-size="17" font-weight="600" fill="#0E1116" text-anchor="start">Na fiscalização, a pergunta é "como você decidiu".</text><text x="40" y="448" font-size="15.5" font-weight="400" fill="#5B616B" text-anchor="start">Cada etapa registrada com autor, data e fonte responde sem reconstrução manual.</text>
